<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWMAURA - AURA</title>
<style>
*{box-sizing:border-box}
body{margin:0; font-family:'Segoe UI',Arial,sans-serif; color:white; text-align:center; min-height:100vh;
  background:#0b0014;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(168,85,247,.5) 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(236,72,153,.5) 0%, transparent 45%);
  background-attachment:fixed; padding:20px 14px 90px; overflow-x:hidden}
.logo{font-size:42px; font-weight:900; letter-spacing:7px; margin:8px 0 0;
  background:linear-gradient(90deg,#c084fc,#ec4899,#f472b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px #ec4899)}
.alt{color:#f9a8d4; font-size:13px; letter-spacing:2px; margin:4px 0 16px}
.orb{width:130px; height:130px; margin:14px auto; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 30% 30%, #f9a8d4, #a855f7 55%, #ec4899);
  display:flex; align-items:center; justify-content:center; font-size:52px;
  box-shadow:0 0 40px #ec4899, 0 0 80px #a855f7; animation:nefes 2s infinite alternate}
@keyframes nefes{from{transform:scale(.95)} to{transform:scale(1.06)}}
.card{max-width:480px; margin:16px auto; padding:22px; border-radius:26px; text-align:center;
  background:rgba(255,255,255,.06); border:1px solid rgba(236,72,153,.45);
  backdrop-filter:blur(12px); box-shadow:0 0 28px rgba(236,72,153,.3)}
input{width:100%; padding:13px; margin:7px 0; border-radius:14px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.45); color:white; outline:none}
button{border:none; padding:14px 18px; border-radius:16px; margin:6px 4px; font-weight:800; cursor:pointer; color:white; font-size:15px}
.btn-neon{background:linear-gradient(90deg,#7c3aed,#ec4899); box-shadow:0 0 22px #ec4899; width:100%}
.btn-pembe{background:#ec4899; box-shadow:0 0 18px #ec4899; width:100%}
.btn-cam{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); width:100%}
.btn-altin{background:linear-gradient(90deg,#f59e0b,#fbbf24); color:black; box-shadow:0 0 18px #f59e0b; width:100%}
#cevap{background:rgba(0,0,0,.35); padding:14px; border-radius:14px; min-height:56px; margin-top:12px; text-align:left; line-height:1.5; border:1px solid rgba(236,72,153,.3)}
.kucuk{font-size:12px; color:#f9a8d4; opacity:.85; margin-top:8px; cursor:pointer; text-decoration:underline}
.hidden{display:none}

/* ===== YILDIZ PATLAMASI + FLOWMAURA EKRANI ===== */
.yildiz{position:fixed; pointer-events:none; z-index:10001; animation:yildizUc 1.1s ease-out forwards}
@keyframes yildizUc{to{transform:translate(var(--x), var(--y)) rotate(360deg) scale(1.6); opacity:0}}
#flowOverlay{
  position:fixed; inset:0; z-index:10000; display:none; align-items:center; justify-content:center; flex-direction:column;
  background:rgba(11,0,20,.92); backdrop-filter:blur(4px);
}
#flowOverlay.acik{display:flex}
.flowBuyuk{
  font-size:52px; font-weight:900; letter-spacing:6px; text-align:center; line-height:1.1;
  background:linear-gradient(90deg,#fff,#f9a8d4,#ec4899,#a78bfa,#fff);
  background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 25px #ec4899); animation:parla 1.2s ease-in-out infinite;
}
@keyframes parla{0%{transform:scale(.8); opacity:.5; background-position:0%} 50%{transform:scale(1.08); opacity:1} 100%{transform:scale(1); background-position:200%}}
.flowAlt{color:#f9a8d4; font-size:16px; letter-spacing:4px; margin-top:10px; font-weight:700}
</style>
</head>
<body>

<!-- YILDIZ + FLOWMAURA OVERLAY -->
<div id="flowOverlay">
  <div class="flowBuyuk">FLOW<br>MAURA</div>
  <div class="flowAlt">✨ AURA AÇILIYOR ✨</div>
</div>

<div class="logo">FLOWMAURA</div>
<p class="alt">✨ AURA MODU AKTİF</p>

<div class="card">
  <div class="orb" onclick="yildizPatlat(event, ()=>auraKonus())">✨</div>
  <p id="auraDurum" style="color:#f9a8d4; margin:6px 0">Aura'ya dokun kral ⭐</p>
  <div id="cevap">Aura burada kral, ne yapalım?</div>
  <button class="btn-neon" onclick="yildizPatlat(event, ()=>dinle())">🎤 Konuş</button>
  <button class="btn-pembe" onclick="yildizPatlat(event, ()=>holoAc())">✨ Holo Desk</button>
  <button class="btn-cam" onclick="yildizPatlat(event, ()=>digerleriGoster())">⚙️ Diğerleri</button>
</div>

<div class="card hidden" id="digerCard">
  <h3 style="margin:0 0 10px">⚙️ Diğerleri</h3>
  <button class="btn-cam" onclick="yildizPatlat(event, ()=>uygulamaAc('instagram'))">📸 Instagram</button>
  <button class="btn-cam" onclick="yildizPatlat(event, ()=>sihirYap())">🪄 Sihir Yap</button>
  <button class="btn-cam" onclick="yildizPatlat(event, ()=>girisGoster())">🔐 Giriş Yap</button>
  <p class="kucuk" onclick="digerleriGizle()">Kapat ↑</p>
</div>

<div class="card hidden" id="girisCard">
  <h3 style="margin:0 0 10px">🔐 Giriş</h3>
  <input id="email" placeholder="Email">
  <input id="sifre" type="password" placeholder="Şifre">
  <button class="btn-neon" onclick="yildizPatlat(event, ()=>girisYap())">Giriş Yap</button>
  <button class="btn-cam" onclick="yildizPatlat(event, ()=>kayitOl())">Kayıt Ol</button>
  <p id="kullanici" style="color:#f9a8d4"></p>
</div>

<div class="card" style="border-color:#f59e0b; box-shadow:0 0 28px rgba(245,158,11,.4)">
  <h3 style="margin:0">💎 Premium</h3>
  <p style="color:#fbbf24; font-size:13px">Kod yazdırma + her şey sınırsız</p>
  <div id="premiumKilitli">
    <button class="btn-altin" onclick="yildizPatlat(event, ()=>premiumAl())">💎 Premium Al - 99₺ / Ay</button>
    <p class="kucuk" onclick="document.getElementById('kodAlani').classList.remove('hidden')">Kodum var →</p>
    <div id="kodAlani" class="hidden">
      <input id="premiumKod" placeholder="FLOW-1234">
      <button class="btn-cam" onclick="yildizPatlat(event, ()=>premiumKodGir())">🔑 Kilidi Aç</button>
    </div>
  </div>
  <div id="premiumAcik" class="hidden">
    <p style="color:#fbbf24">👑 Premium Aktif!</p>
    <input id="kodIstek" placeholder="Bana hesap makinesi kodu yaz...">
    <button class="btn-neon" onclick="yildizPatlat(event, ()=>kodYazdir())">💻 Kod Yazdır</button>
    <div id="kodBox" style="display:none;background:#000;padding:12px;border-radius:12px;text-align:left;white-space:pre-wrap;margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== SADECE YILDIZ + TAM EKRAN FLOWMAURA + SOHBET =====
let patliyor = false;
function yildizPatlat(e, sonraYap){
  if(patliyor) return; patliyor = true;
  let x = e.clientX || window.innerWidth/2;
  let y = e.clientY || 300;
  let yildizlar = ['⭐','✨','🌟','💫','⭐','✨'];

  // 1. EKRANI YILDIZLA DOLDUR - 60 tane
  for(let i=0;i<60;i++){
    let s=document.createElement('div');
    s.className='yildiz';
    s.innerText=yildizlar[Math.floor(Math.random()*yildizlar.length)];
    // rastgele yerden başlasın, tüm ekran dolsun
    let basX = Math.random()*window.innerWidth;
    let basY = Math.random()*window.innerHeight;
    s.style.left=basX+'px'; s.style.top=basY+'px';
    s.style.fontSize=(14+Math.random()*28)+'px';
    let aci = Math.random()*Math.PI*2;
    let mes = 80+Math.random()*180;
    s.style.setProperty('--x', Math.cos(aci)*mes+'px');
    s.style.setProperty('--y', Math.sin(aci)*mes+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1200);
  }
  if(navigator.vibrate) navigator.vibrate(20);

  // 2. ORTAYA KOCAMAN FLOWMAURA
  let overlay = document.getElementById('flowOverlay');
  overlay.classList.add('acik');

  // 3. 1.4 SANİYE SONRA KAPAT + SOHBETİ AÇ
  setTimeout(()=>{
    overlay.classList.remove('acik');
    patliyor = false;
    if(sonraYap) sonraYap();
  }, 1400);
}

function konus(m){let s=new SpeechSynthesisUtterance(m); s.lang='tr-TR'; speechSynthesis.speak(s)}
function auraKonus(){document.getElementById('cevap').innerHTML='✨ <b>AURA:</b> Efendim kral, sohbet açıldı ⭐ Ne yapalım?'; konus('Efendim kral, sohbet açıldı')}
function digerleriGoster(){document.getElementById('digerCard').classList.remove('hidden'); document.getElementById('digerCard').scrollIntoView({behavior:'smooth'})}
function digerleriGizle(){document.getElementById('digerCard').classList.add('hidden')}
function girisGoster(){document.getElementById('girisCard').classList.remove('hidden'); document.getElementById('girisCard').scrollIntoView({behavior:'smooth'})}
const SUPABASE_URL="BURAYA_PROJECT_URL"; const SUPABASE_KEY="BURAYA_ANON_KEY";
let supabaseClient=null; let varMi=SUPABASE_URL.includes('supabase.co');
if(varMi){try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){varMi=false}}
async function kayitOl(){let e=document.getElementById('email').value.trim(), s=document.getElementById('sifre').value.trim(); if(!e||!s) return alert('Email + şifre gir'); let k=JSON.parse(localStorage.getItem('flowmaura_users')||'{}'); k[e]=s; localStorage.setItem('flowmaura_users',JSON.stringify(k)); document.getElementById('kullanici').innerText='✅ Kayıt oldu: '+e}
async function girisYap(){let e=document.getElementById('email').value.trim(), s=document.getElementById('sifre').value.trim(); let k=JSON.parse(localStorage.getItem('flowmaura_users')||'{}'); if(k[e]===s) document.getElementById('kullanici').innerText='✅ Hoşgeldin: '+e; else alert('Giriş olmadı kral')}
function dinle(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return alert('Chrome kullan kral'); let r=new SR(); r.lang='tr-TR'; document.getElementById('cevap').innerText='🎤 Dinliyorum... ⭐'; r.start(); r.onresult=e=>{let s=e.results[0][0].transcript; document.getElementById('cevap').innerHTML='<b>Sen:</b> '+s+'<br><br><b>AURA:</b> Anladım kral, '+s; konus('Anladım kral, '+s)}}
function holoAc(){document.getElementById('auraDurum').innerText='✨ HOLO DESK AÇIK'; document.getElementById('cevap').innerHTML='✨ <b>AURA:</b> Holo Desk açıldı kral, sohbet hazır!'; konus('Holo Desk açıldı kral')}
function uygulamaAc(u){if(u==='instagram') window.open('https://www.instagram.com/','_blank')}
function sihirYap(){let f=['✨ Bugün şans senden yana.','💰 Para geliyor, sabret.','❤️ Biri seni düşünüyor.','🚀 Büyük fırsat yakın.']; let sec=f[Math.floor(Math.random()*f.length)]; document.getElementById('cevap').innerHTML='🪄 <b>AURA:</b> '+sec; konus(sec)}
let isPremium = localStorage.getItem('flowmaura_premium')==='evet';
if(isPremium){document.getElementById('premiumKilitli').classList.add('hidden'); document.getElementById('premiumAcik').classList.remove('hidden')}
function premiumAl(){document.getElementById('kodAlani').classList.remove('hidden'); document.getElementById('premiumKod').value='FLOW-1234'; alert('Demo kod: FLOW-1234')}
function premiumKodGir(){let kod=document.getElementById('premiumKod').value.trim().toUpperCase(); if(["FLOW-1234"].includes(kod)){isPremium=true; localStorage.setItem('flowmaura_premium','evet'); document.getElementById('premiumKilitli').classList.add('hidden'); document.getElementById('premiumAcik').classList.remove('hidden'); alert('👑 Premium açıldı kral!')} else alert('Kod yanlış')}
function kodYazdir(){let box=document.getElementById('kodBox'); box.style.display='block'; box.innerText='⏳ Aura kod yazıyor... ⭐'}
</script>
</body>
</html>
